<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7df" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <title>かいて まなぼう</title>
</head>
<body>
  <main class="app">
    <header><span class="logo">✏️ かいて まなぼう</span><button id="homeButton" class="home" aria-label="おうちへ">⌂</button></header>

    <section id="home" class="screen active">
      <div class="hero"><span>🌈</span><h1>きょうは なにを<br>やってみる？</h1></div>
      <div class="choices">
        <button class="choice pink" data-go="trace"><span>あ</span><b>ひらがなを<br>なぞろう</b></button>
        <button class="choice blue" data-go="math"><span>1＋2</span><b>たしざんを<br>しよう</b></button>
      </div>
      <p class="hint">ゆびで かいて あそぼう！</p>
    </section>

    <section id="trace" class="screen lesson">
      <p class="instruction"><span id="kanaName">「あ」</span>を ゆびで なぞってみよう</p>
      <div class="trace-card">
        <div id="kanaPicker" class="kana-picker" aria-label="れんしゅうする ひらがな"></div>
        <div class="writing-area trace-area">
          <canvas id="guideCanvas" width="720" height="720" aria-label="ひらがな のお手本"></canvas>
          <canvas id="traceCanvas" width="720" height="720"></canvas>
        </div>
        <p id="traceMessage" class="friendly">おてほんの うえを なぞろう</p>
        <div class="actions"><button class="secondary" data-clear="traceCanvas">やりなおす</button><button id="checkTrace" class="primary">できた！</button></div>
      </div>
    </section>

    <section id="math" class="screen lesson">
      <p class="instruction">こたえの すうじを かいてみよう</p>
      <div class="math-card">
        <div id="question" class="question">1 ＋ 3 ＝</div>
        <div id="carVisual" class="car-visual" aria-label="パトカーで かずを かぞえよう"></div>
        <div id="numberPad" class="number-pad" aria-label="こたえの すうじ"></div>
        <div class="writing-area number-area"><canvas id="numberCanvas" width="720" height="500"></canvas><span class="answer-label">ここに かこう</span></div>
        <p id="mathMessage" class="friendly">ゆびで すうじを かいてね</p>
        <div class="actions"><button class="secondary" data-clear="numberCanvas">やりなおす</button><button id="checkMath" class="primary">こたえる！</button></div>
      </div>
    </section>
  </main>
  <div id="celebration" class="celebration" aria-live="polite"><div><span id="celebrationIcon">⭐</span><h2 id="celebrationTitle">すごい！</h2><p id="celebrationText">じょうずに できたね！</p><button id="nextButton" class="primary">つぎへ</button></div></div>
  <script src="app.js"></script>
</body>
</html>
